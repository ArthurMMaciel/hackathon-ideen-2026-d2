<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empréstimo de equipamentos</title>
  <style>
    :root {
      --fundo: #f5f6f8; --cartao: #ffffff; --texto: #1f2933; --suave: #616e7c; --borda: #d9dee4;
      --primaria: #2459c7; --primaria-escura: #1b4497; --ok: #1d7a46; --ok-fundo: #e6f4ec;
      --erro: #b42318; --erro-fundo: #fdecea; --raio: 10px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { background: var(--cartao); border-bottom: 1px solid var(--borda); padding: 16px; }
    header h1 { margin: 0 auto; max-width: 1080px; font-size: 20px; }
    main { margin: 0 auto; max-width: 1080px; padding: 16px; display: grid; gap: 16px; }
    section { background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px; }
    section h2 { margin: 0 0 12px; font-size: 16px; }
    form, .filtros { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; }
    label { display: grid; gap: 4px; font-size: 13px; color: var(--suave); }
    input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; color: var(--texto); width: 100%; }
    button { font: inherit; padding: 9px 14px; border: 0; border-radius: 8px; background: var(--primaria); color: #fff; cursor: pointer; }
    button:hover { background: var(--primaria-escura); }
    button.secundario { background: #e4e8ee; color: var(--texto); }
    .tabela { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 480px; }
    th, td { border-bottom: 1px solid var(--borda); padding: 8px; text-align: left; vertical-align: top; }
    th { font-size: 13px; color: var(--suave); font-weight: 600; }
    .etiqueta { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #e4e8ee; font-size: 12px; font-weight: 600; }
    .mensagem { padding: 10px 12px; border-radius: 8px; }
    .mensagem.ok { background: var(--ok-fundo); color: var(--ok); }
    .mensagem.erro { background: var(--erro-fundo); color: var(--erro); }
    .vazio { color: var(--suave); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><h1>Empréstimo de equipamentos</h1></header>
  <main>
    <div id="mensagem" class="mensagem" hidden></div>
    <section>
      <h2>Emprestar</h2>
      <form id="form-emprestar">
        <label>Equipamento disponível
          <select name="equipamento_id" id="campo-equipamento" required></select>
        </label>
        <label>Nome
          <input name="nome" maxlength="200" required>
        </label>
        <label>E-mail
          <input name="email" type="email" maxlength="254" required>
        </label>
        <label>Devolução prevista
          <input name="data_prevista" type="date" required>
        </label>
        <button type="submit">Emprestar</button>
      </form>
      <p class="vazio">Prazo máximo: 14 dias para notebook, 3 dias para projetor e headset.</p>
    </section>
    <section>
      <h2>Empréstimos em aberto</h2>
      <div id="tabela-abertos"><p class="vazio">Carregando...</p></div>
    </section>
    <section>
      <h2>Atrasados</h2>
      <div id="tabela-atrasados"><p class="vazio">Carregando...</p></div>
    </section>
    <section>
      <h2>Equipamentos disponíveis</h2>
      <div class="filtros">
        <label>Tipo
          <select id="filtro-tipo">
            <option value="">Todos</option>
            <option value="NOTEBOOK">NOTEBOOK</option>
            <option value="PROJETOR">PROJETOR</option>
            <option value="HEADSET">HEADSET</option>
          </select>
        </label>
      </div>
      <div id="tabela-disponiveis"><p class="vazio">Carregando...</p></div>
    </section>
  </main>
  <script>
    // Dados da API entram sempre por textContent; nunca por innerHTML.
    async function api(caminho, opcoes = {}) {
      const resposta = await fetch(caminho, { headers: { "Content-Type": "application/json" }, ...opcoes });
      const corpo = resposta.status === 204 ? null : await resposta.json().catch(() => null);
      if (!resposta.ok) {
        const detalhe = corpo && Array.isArray(corpo.detail) ? corpo.detail.map((d) => d.msg).join("; ") : null;
        throw new Error((corpo && corpo.mensagem) || detalhe || resposta.statusText);
      }
      return corpo;
    }

    function mostrarMensagem(texto, tipo = "ok") {
      const caixa = document.getElementById("mensagem");
      caixa.textContent = texto;
      caixa.className = "mensagem " + tipo;
      caixa.hidden = false;
    }

    // Lê os campos de um <form> num objeto; campos type=number viram número, vazios ficam de fora.
    function lerFormulario(form) {
      const dados = {};
      for (const campo of form.elements) {
        if (!campo.name || campo.value === "") continue;
        dados[campo.name] = campo.type === "number" ? Number(campo.value) : campo.value;
      }
      return dados;
    }

    // Monta uma tabela dentro de `destino`. colunas: [{titulo, valor: (linha) => texto}].
    function desenharTabela(destino, colunas, linhas, textoVazio = "Nada para mostrar.") {
      destino.replaceChildren();
      if (!linhas.length) {
        const p = document.createElement("p");
        p.className = "vazio";
        p.textContent = textoVazio;
        destino.append(p);
        return;
      }
      const envoltorio = document.createElement("div");
      envoltorio.className = "tabela";
      const tabela = document.createElement("table");
      const cabecalho = tabela.createTHead().insertRow();
      for (const coluna of colunas) {
        const th = document.createElement("th");
        th.textContent = coluna.titulo;
        cabecalho.append(th);
      }
      const corpo = tabela.createTBody();
      for (const linha of linhas) {
        const tr = corpo.insertRow();
        for (const coluna of colunas) {
          const valor = coluna.valor(linha);
          const td = tr.insertCell();
          if (valor instanceof Node) td.append(valor);
          else td.textContent = valor ?? "";
        }
      }
      envoltorio.append(tabela);
      destino.append(envoltorio);
    }

    function etiqueta(texto) {
      const span = document.createElement("span");
      span.className = "etiqueta";
      span.textContent = texto;
      return span;
    }

    async function carregarDisponiveis() {
      const tipo = document.getElementById("filtro-tipo").value;
      const caminho = "/api/equipamentos/disponiveis" + (tipo ? "?tipo=" + encodeURIComponent(tipo) : "");
      const [filtrados, todos] = await Promise.all([api(caminho), api("/api/equipamentos/disponiveis")]);
      desenharTabela(document.getElementById("tabela-disponiveis"), [
        { titulo: "Patrimônio", valor: (e) => e.patrimonio },
        { titulo: "Tipo", valor: (e) => e.tipo },
        { titulo: "Descrição", valor: (e) => e.descricao },
        { titulo: "Situação", valor: (e) => etiqueta(e.situacao) },
      ], filtrados, "Nenhum equipamento disponível.");

      const seletor = document.getElementById("campo-equipamento");
      seletor.replaceChildren();
      for (const e of todos) {
        const opcao = document.createElement("option");
        opcao.value = String(e.id);
        opcao.textContent = e.patrimonio + " · " + e.tipo + " · " + e.descricao;
        seletor.append(opcao);
      }
    }

    async function carregarAbertos() {
      const abertos = await api("/api/emprestimos?status=ABERTO");
      desenharTabela(document.getElementById("tabela-abertos"), [
        { titulo: "Equipamento", valor: (e) => e.patrimonio + " (" + e.tipo + ")" },
        { titulo: "Pessoa", valor: (e) => e.nome + " <" + e.email + ">" },
        { titulo: "Retirada", valor: (e) => e.data_retirada },
        { titulo: "Prevista", valor: (e) => e.data_prevista },
        { titulo: "Devolução", valor: (e) => botaoDevolver(e) },
      ], abertos, "Nenhum empréstimo em aberto.");
    }

    function botaoDevolver(emprestimo) {
      const caixa = document.createElement("div");
      const rotulo = document.createElement("label");
      const defeito = document.createElement("input");
      defeito.type = "checkbox";
      defeito.style.width = "auto";
      rotulo.append(defeito, document.createTextNode(" com defeito"));
      const botao = document.createElement("button");
      botao.type = "button";
      botao.textContent = "Devolver";
      botao.addEventListener("click", async () => {
        try {
          await api("/api/emprestimos/" + emprestimo.id + "/devolver", {
            method: "POST", body: JSON.stringify({ defeito: defeito.checked }),
          });
          mostrarMensagem("Devolução de " + emprestimo.patrimonio + " registrada.");
          await recarregar();
        } catch (e) {
          mostrarMensagem("Erro: " + e.message, "erro");
        }
      });
      caixa.append(rotulo, botao);
      return caixa;
    }

    async function carregarAtrasados() {
      const atrasados = await api("/api/emprestimos/atrasados");
      desenharTabela(document.getElementById("tabela-atrasados"), [
        { titulo: "Equipamento", valor: (e) => e.patrimonio + " (" + e.tipo + ")" },
        { titulo: "Pessoa", valor: (e) => e.nome + " <" + e.email + ">" },
        { titulo: "Prevista", valor: (e) => e.data_prevista },
        { titulo: "Dias de atraso", valor: (e) => String(e.dias_atraso) },
      ], atrasados, "Nenhum empréstimo atrasado.");
    }

    async function recarregar() {
      try {
        await Promise.all([carregarDisponiveis(), carregarAbertos(), carregarAtrasados()]);
      } catch (e) {
        mostrarMensagem("Erro: " + e.message, "erro");
      }
    }

    document.getElementById("form-emprestar").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const dados = lerFormulario(evento.target);
      if (!dados.equipamento_id) {
        mostrarMensagem("Erro: não há equipamento disponível selecionado.", "erro");
        return;
      }
      dados.equipamento_id = Number(dados.equipamento_id);
      try {
        const emprestimo = await api("/api/emprestimos", { method: "POST", body: JSON.stringify(dados) });
        mostrarMensagem("Empréstimo de " + emprestimo.patrimonio + " registrado até " + emprestimo.data_prevista + ".");
        evento.target.reset();
        await recarregar();
      } catch (e) {
        mostrarMensagem("Erro: " + e.message, "erro");
      }
    });

    document.getElementById("filtro-tipo").addEventListener("change", recarregar);

    recarregar();
  </script>
</body>
</html>
