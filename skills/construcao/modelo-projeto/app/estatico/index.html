<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema gerado</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; }
    .erro { color: #b00020; }
    .ok { color: #1b5e20; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  <h1>Sistema gerado</h1>
  <p id="status">Carregando...</p>
  <script>
    // Sempre textContent para dados vindos da API; nunca innerHTML.
    async function api(caminho, opcoes = {}) {
      const resposta = await fetch(caminho, { headers: { "Content-Type": "application/json" }, ...opcoes });
      const corpo = resposta.status === 204 ? null : await resposta.json();
      if (!resposta.ok) {
        const mensagem = corpo && (corpo.mensagem || JSON.stringify(corpo.detail)) || resposta.statusText;
        throw new Error(mensagem);
      }
      return corpo;
    }

    api("/api/saude")
      .then(() => { document.getElementById("status").textContent = "API disponível."; })
      .catch((e) => { document.getElementById("status").textContent = "Erro: " + e.message; });
  </script>
</body>
</html>
